name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 2.1.0 or 2.1.0-beta.1
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then raw="$GITHUB_REF_NAME"; else raw="$INPUT_VERSION"; fi
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' isn't a version like 2.1.0 or 2.1.0-beta.1"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version already exists. Push a new tag or pick another version."
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v6
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install
        run: npm ci

      - name: Set version
        run: node scripts/version.mjs --set=${{ steps.v.outputs.version }}

      - name: Build, package and verify
        run: npm run dist -- --no-bump

      - name: Tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          git tag "${{ steps.v.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Prepare assets and notes
        shell: bash
        run: |
          node scripts/release-notes.mjs --summary --stage=release --notes=release/NOTES.md --tag=${{ steps.v.outputs.tag }}
          ls -la release

      - name: Publish
        shell: bash
        run: |
          tag="${{ steps.v.outputs.tag }}"
          files=(release/*.exe release/SHA256SUMS.txt release/release.json)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --notes-file release/NOTES.md
          else
            flags=(--title "Xaver ${{ steps.v.outputs.version }}" --notes-file release/NOTES.md --draft --verify-tag)
            if [ "${{ steps.v.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$tag" "${files[@]}" "${flags[@]}"
            gh release edit "$tag" --draft=false
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
