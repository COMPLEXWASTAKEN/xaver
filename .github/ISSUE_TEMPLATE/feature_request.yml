name: Feature idea
description: Suggest something new for Xaver
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome, but the surest way to get a feature is to open a pull request for it.
        For bigger changes, describe the plan here first so the approach can be agreed before you build it.
  - type: textarea
    id: problem
    attributes:
      label: What's missing
      description: What are you trying to do that Xaver doesn't handle well today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: What would you like to see? Mockups or examples help.
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: Will you open a pull request?
      options:
        - Yes, I'd like to build it
        - Maybe, with some pointers
        - No, just suggesting
    validations:
      required: true
