name: Feature request
description: Ask for something new in Xaver
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Here's how requests work:

        1. **Vote.** Check the [Feature board](https://github.com/COMPLEXWASTAKEN/xaver/issues?q=is%3Aissue+is%3Aopen+label%3Afeature-board) first. If your idea is already there, add a 👍 to it instead of opening a new one. The board is ranked by 👍.
        2. **Triage.** New requests are labelled `planned`, `help wanted` or `not planned`.
        3. **Build.** The fastest way to get a feature is a pull request. Say below if you'd like to build it, and link this issue from your PR with `Closes #<number>`.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you post
      options:
        - label: I searched open and closed requests and this isn't already there
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanning
        - Downloads and folders
        - Gallery and preview
        - Library and database
        - Failed downloads
        - Notifications
        - Security and privacy
        - Look and feel
        - Installer and updates
        - Something else
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's missing
      description: What are you trying to do that Xaver doesn't handle well today?
      placeholder: When I scan a profile with thousands of posts, I can't…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: What would you like to see? Mockups, sketches or examples from other apps help a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
      description: Optional. Anything you do today to get around it.
  - type: dropdown
    id: importance
    attributes:
      label: How much would this help you?
      options:
        - Nice to have
        - I'd use it often
        - I can't use Xaver properly without it
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: Will you build it?
      options:
        - Yes, I'll open a pull request
        - Maybe, with some pointers
        - No, just suggesting
    validations:
      required: true
